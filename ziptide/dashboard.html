:root{
 --ink:#191814; --ink-2:#232118; --paper:#FBF8F2; --cream:#F2ECDF;
 --gold:#B79362; --gold-dim:#8E7048;
 --pine:#2E5545; --pine-lt:#7FA48E;
 --clay:#A06A32; --clay-lt:#D2A46E;
 --text:#26241E; --soft:#6E6858; --rule:#DED5C2;
 box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--text);
 font-family:InterT,system-ui,sans-serif;font-weight:400;line-height:1.62;
 font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.shell{max-width:62rem;margin:0 auto;padding:0 clamp(1.1rem,4vw,3rem)}

/* ── açılış ── */
.open{background:var(--ink);color:var(--cream);position:relative;overflow:hidden;
 padding:clamp(3rem,9vw,6.5rem) 0 clamp(2.4rem,6vw,4rem)}
.open svg.motif{position:absolute;top:-9%;right:-5%;width:min(27rem,46%);opacity:.085;pointer-events:none;z-index:0;
 -webkit-mask-image:linear-gradient(200deg,#000 18%,transparent 72%);mask-image:linear-gradient(200deg,#000 18%,transparent 72%)}
@media(max-width:760px){.open svg.motif{width:62%;top:-5%;right:-14%;opacity:.07}}
.lang{position:absolute;top:1rem;right:clamp(1.1rem,4vw,3rem);display:flex;gap:.1rem;z-index:3}
.lang button{background:none;border:1px solid rgba(242,236,223,.28);color:rgba(242,236,223,.6);
 font:inherit;font-size:.8rem;padding:.3rem .72rem;cursor:pointer;letter-spacing:.02em}
.lang button:first-child{border-radius:2px 0 0 2px}.lang button:last-child{border-radius:0 2px 2px 0;border-left:none}
.lang button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600}
.lang button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1{font-family:Fraunces;font-weight:600;font-size:clamp(2.3rem,7.2vw,4.6rem);line-height:.98;
 letter-spacing:-.022em;margin:0 0 1.1rem;max-width:15ch;position:relative;z-index:2}
.lede{font-size:clamp(1rem,1.9vw,1.2rem);line-height:1.58;max-width:46ch;color:rgba(242,236,223,.8);
 margin:0;position:relative;z-index:2}
.hero-fig{position:relative;z-index:2;margin-top:clamp(2rem,5vw,3.2rem);isolation:isolate}
.hero-fig #scatter{background:var(--ink);border-radius:2px}
.hero-fig h2{font-family:Fraunces;font-weight:500;font-size:1.22rem;margin:0 0 .12rem;color:var(--cream)}
.hero-fig p{margin:0 0 1.2rem;font-size:.9rem;color:rgba(242,236,223,.62);max-width:52ch}
.keys{display:flex;flex-wrap:wrap;gap:.3rem 1.5rem;margin-top:1rem;font-size:.84rem;color:rgba(242,236,223,.72)}
.keys span{display:flex;align-items:center;gap:.45rem;margin-right:1.4rem}
.keys span:last-child{margin-right:0}
.keys i{width:.62rem;height:.62rem;border-radius:50%;display:inline-block;margin-right:.4rem;flex:none}

/* ── akış ── */
main{padding:clamp(2.6rem,7vw,5rem) 0 1rem}
.band{padding-bottom:clamp(2.6rem,7vw,4.6rem);margin-bottom:clamp(2.6rem,7vw,4.6rem);border-bottom:1px solid var(--rule)}
.band:last-of-type{border-bottom:none}
h2.sec{font-family:Fraunces;font-weight:600;font-size:clamp(1.5rem,3.4vw,2.15rem);letter-spacing:-.015em;
 margin:0 0 .2rem;line-height:1.1}
p.sub{margin:0 0 1.9rem;color:var(--soft);font-size:.94rem;max-width:56ch}
figure{margin:0}
svg{display:block;width:100%;height:auto;overflow:visible}
text{font-family:InterT;font-variant-numeric:tabular-nums}

/* ── tablo ── */
.tools{display:flex;gap:.55rem;flex-wrap:wrap;margin-bottom:1.1rem}
input,select{font:inherit;font-size:.9rem;padding:.48rem .7rem;border:1px solid var(--rule);
 background:var(--paper);color:var(--text);border-radius:2px}
input{flex:1;min-width:11rem}
input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
thead th{text-align:left;font-weight:600;font-size:.8rem;color:var(--soft);padding:.4rem .7rem .55rem;
 border-bottom:1.5px solid var(--text);cursor:pointer;white-space:nowrap;background:none}
thead th:hover{color:var(--gold-dim)}
thead th[aria-sort]{color:var(--text)}
tbody td{padding:.5rem .7rem;border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr:hover{background:var(--cream)}
td.num{width:7.2rem}
.meter{display:flex;align-items:center;gap:.5rem}
.meter em{font-style:normal;font-size:.86rem;min-width:1.8rem;text-align:right;color:var(--soft)}
.meter b{display:block;height:3px;border-radius:2px}
.meter div{flex:1;background:var(--rule);height:3px;border-radius:2px}
.dot{width:.5rem;height:.5rem;border-radius:50%;display:inline-block;margin-right:.45rem;vertical-align:.02rem}

/* ── paylar ── */
.shares{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:clamp(1.6rem,4vw,3rem)}
.shares h3{font-family:Fraunces;font-weight:500;font-size:1.05rem;margin:0 0 .9rem;color:var(--text)}
.srow{display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;align-items:baseline;padding:.42rem 0;border-bottom:1px solid var(--rule)}
.srow:last-child{border-bottom:none}
.srow .nm{font-size:.92rem}
.srow .pc{font-family:Fraunces;font-weight:600;font-size:1.02rem}
.srow .tr{grid-column:1/-1;height:3px;background:var(--rule);border-radius:2px;margin-top:.16rem}
.srow .tr i{display:block;height:100%;border-radius:2px}
.neg .pc{color:var(--clay)}

/* ── yöntem ── */
.method{background:var(--cream);padding:clamp(1.6rem,4vw,2.6rem);border-left:2px solid var(--gold)}
.method h2{font-family:Fraunces;font-weight:600;font-size:1.32rem;margin:0 0 .9rem}
.method p{margin:0 0 .85rem;font-size:.93rem;max-width:68ch;color:#3A362C}
.method p:last-child{margin-bottom:0}
footer{padding:2.6rem 0 3.4rem;font-size:.84rem;color:var(--soft);line-height:1.8}
footer .t{color:var(--gold-dim)}
@media (prefers-reduced-motion:no-preference){.pt{animation:in .5s ease-out both}}
@keyframes in{from{opacity:0}to{opacity:1}}
</style></head><body>

<header class="open">
  <div id="motif"></div>
  <div class="lang"><button data-l="tr">TR</button><button data-l="en">EN</button></div>
  <div class="shell">
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
    <figure class="hero-fig">
      <h2 id="sct"></h2><p id="scs"></p>
      <div id="scatter"></div>
      <div class="keys" id="keys"></div>
    </figure>
  </div>
</header>

<main class="shell">
  <section class="band"><h2 class="sec" id="regt"></h2><p class="sub" id="regs"></p><figure id="reg"></figure></section>
  <section class="band"><h2 class="sec" id="catt"></h2><p class="sub" id="cats"></p><figure id="cat"></figure></section>
  <section class="band">
    <h2 class="sec" id="tblt"></h2><p class="sub" id="tbls"></p>
    <div class="tools"><input id="q" type="search"><select id="fr"></select><select id="fq"></select></div>
    <div class="tw"><table><thead id="th"><tr><th>Yemek</th><th>Bölge</th><th>Tür</th><th>Bağırsak</th><th>Sürdürülebilirlik</th></tr></thead><tbody id="tb"></tbody></table></div>
  </section>

/* ---------- açılış motifi: kitap kapağındaki geçmeli kare deseninden ---------- */
function motif(){
  let p="";const u=54,R=4,Cn=5;
  for(let r=0;r<R;r++)for(let c=0;c<Cn;c++){
    const x=c*u,y=r*u,k=(r+c)%3;
    if(k===0)p+=`<rect x="${x+9}" y="${y+9}" width="${u-18}" height="${u-18}" fill="none" stroke="${GOLD}" stroke-width="1.5"/>`;
    else if(k===1)p+=`<path d="M${x+u/2} ${y+7}L${x+u-7} ${y+u/2}L${x+u/2} ${y+u-7}L${x+7} ${y+u/2}Z" fill="none" stroke="${GOLD}" stroke-width="1.5"/>`;
    else p+=`<circle cx="${x+u/2}" cy="${y+u/2}" r="${u/2-13}" fill="none" stroke="${GOLD}" stroke-width="1.2"/>`;
  }
  return `<svg class="motif" viewBox="0 0 ${Cn*u} ${R*u}" aria-hidden="true">${p}</svg>`;
}

/* ---------- ölçek ---------- */
const sc=(d0,d1,r0,r1)=>v=>r0+(v-d0)/(d1-d0)*(r1-r0);

/* ---------- dağılım (açılış) ---------- */
function scatter(){
  const w=1000,h=560,m={t:16,r:22,b:52,l:60};
  const X=sc(0,100,m.l,w-m.r), Y=sc(0,100,h-m.b,m.t);
  let g="";
  for(let v=0;v<=100;v+=25){
    g+=`<line x1="${X(v)}" y1="${m.t}" x2="${X(v)}" y2="${h-m.b}" stroke="rgba(242,236,223,.10)"/>`;
    g+=`<line x1="${m.l}" y1="${Y(v)}" x2="${w-m.r}" y2="${Y(v)}" stroke="rgba(242,236,223,.10)"/>`;
    g+=`<text x="${X(v)}" y="${h-m.b+22}" fill="rgba(242,236,223,.5)" font-size="13" text-anchor="middle">${v}</text>`;
    g+=`<text x="${m.l-12}" y="${Y(v)+4}" fill="rgba(242,236,223,.5)" font-size="13" text-anchor="end">${v}</text>`;
  }
  g+=`<line x1="${X(D.gm)}" y1="${m.t}" x2="${X(D.gm)}" y2="${h-m.b}" stroke="rgba(183,147,98,.5)" stroke-dasharray="3 4"/>`;
  g+=`<line x1="${m.l}" y1="${Y(D.sm)}" x2="${w-m.r}" y2="${Y(D.sm)}" stroke="rgba(183,147,98,.5)" stroke-dasharray="3 4"/>`;
  const seen={};
  D.r.forEach((d,i)=>{
    const key=d.g+"_"+d.s; const n=seen[key]=(seen[key]||0)+1;
    const a=(n-1)*2.4, dx=n>1?Math.cos(a)*7:0, dy=n>1?Math.sin(a)*7:0;
    g+=`<circle class="pt" style="animation-delay:${i*9}ms" cx="${X(d.g)+dx}" cy="${Y(d.s)+dy}" r="6.5" fill="${C[d.q]}" fill-opacity=".88" stroke="${INK}" stroke-width="1"><title>${esc(d.n)} — ${esc(d.b)} · ${d.g} / ${d.s}</title></circle>`;
  });
  g+=`<text x="${(w-m.l-m.r)/2+m.l}" y="${h-8}" fill="rgba(242,236,223,.62)" font-size="13.5" text-anchor="middle">${esc(T[L].xlab)}</text>`;
  g+=`<text transform="translate(16 ${(h-m.b+m.t)/2}) rotate(-90)" fill="rgba(242,236,223,.62)" font-size="13.5" text-anchor="middle">${esc(T[L].ylab)}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(T[L].scatterTitle)}">${g}</svg>`;
}

    g+=`<text x="${X(d.s)+7}" y="${y+28}" fill="${CLAY}" font-size="12.5">${d.s}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg>`;
}

/* ---------- tablo ---------- */
let sortK="g",asc=false;
function meter(v,col){return `<div class="meter"><em>${v}</em><div><b style="width:${v}%;background:${col}"></b></div></div>`}
function table(){
  const q=$("#q").value.toLowerCase(), fr=$("#fr").value, fq=$("#fq").value;
  let rows=D.r.filter(d=>(!q||d.n.toLowerCase().includes(q))&&(!fr||d.b===fr)&&(!fq||d.q===fq));
  rows.sort((a,b)=>{const x=a[sortK],y=b[sortK];
    const c=typeof x==="number"?x-y:String(x).localeCompare(String(y),"tr");return asc?c:-c});
  $("#tb").innerHTML=rows.map(d=>`<tr><td><span class="dot" style="background:${C[d.q]}"></span>${esc(d.n)}</td>
   <td>${esc(d.b)}</td><td>${esc(d.k)}</td><td class="num">${meter(d.g,PINE)}</td><td class="num">${meter(d.s,CLAY)}</td></tr>`).join("");
}

/* ---------- paylar ---------- */
function shares(){
  const row=(o,col)=>`<div class="srow${o.p<0?" neg":""}"><span class="nm">${esc(o[L])}</span>
    <span class="pc">${o.p<0?"−":""}${Math.abs(o.p)}</span>
    <span class="tr"><i style="width:${Math.abs(o.p)}%;background:${col}"></i></span></div>`;
  $("#wg").innerHTML=`<h3>${esc(T[L].wGut)}</h3>`+W.g.map(o=>row(o,o.p<0?CLAY:PINE)).join("");
  $("#ws").innerHTML=`<h3>${esc(T[L].wSus)}</h3>`+W.s.map(o=>row(o,GOLD)).join("");
}

/* ---------- çizim ---------- */
function paint(){
  const t=T[L];
  document.documentElement.lang=L;
  $("#h1").textContent=t.title; $("#lede").textContent=t.lede;
  $("#sct").textContent=t.scatterTitle; $("#scs").textContent=t.scatterSub;
  $("#scatter").innerHTML=scatter();
  $("#keys").innerHTML=["star","gut","sus","dev"].map(k=>
    `<span><i style="background:${C[k]}"></i>${esc(t["q_"+k])}</span>`).join("");
  $("#regt").textContent=t.regTitle; $("#regs").textContent=t.regSub;
  $("#reg").innerHTML=pairs(D.reg,"b");
  $("#catt").textContent=t.catTitle; $("#cats").textContent=t.catSub;
  $("#cat").innerHTML=pairs(D.cat,"k");
  $("#tblt").textContent=t.tblTitle; $("#tbls").textContent=t.tblSub;
  $("#q").placeholder=t.search;
  ["thName","thReg","thCat","thGut","thSus"].forEach((k,i)=>document.querySelectorAll("#th th")[i].firstChild.nodeValue=t[k]);
  const fr=$("#fr"),fq=$("#fq"),pv=fr.value,pq=fq.value;
  fr.innerHTML=`<option value="">${esc(t.allReg)}</option>`+D.reg.map(r=>`<option>${esc(r.b)}</option>`).join("");
  fq.innerHTML=`<option value="">${esc(t.allQ)}</option>`+["star","gut","sus","dev"].map(k=>`<option value="${k}">${esc(t["q_"+k])}</option>`).join("");
  fr.value=pv;fq.value=pq;
  $("#wt").textContent=t.wTitle; $("#ws2").textContent=t.wSub; shares();
  $("#st").textContent=t.sTitle; $("#ss").textContent=t.sSub;
  $("#sh").innerHTML=`<tr><th>${esc(t.thScheme)}</th><th>${esc(t.thRho)}</th><th>${esc(t.thT10)}</th><th>${esc(t.thT5)}</th></tr>`;
  $("#sb").innerHTML=D.sens.map(([n,r,a,b])=>`<tr><td>${esc(n)}</td><td>${r.toFixed(3)}</td><td>${a}/10</td><td>${b}/5</td></tr>`).join("");
  $("#mt").textContent=t.mTitle;
  $("#mb").innerHTML=[t.m1,t.m2,t.m3,t.m4].map(p=>`<p>${esc(p)}</p>`).join("");
  $("#ft").innerHTML=`${esc(t.src)}<br><span class="t">${esc(t.team)}</span>`;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  table();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;paint()});
document.querySelectorAll("#th th").forEach((th,i)=>{const k=["n","b","k","g","s"][i];
  th.onclick=()=>{asc=(k===sortK)?!asc:false;sortK=k;
    document.querySelectorAll("#th th").forEach(x=>x.removeAttribute("aria-sort"));
    th.setAttribute("aria-sort",asc?"ascending":"descending");table()}});
["q","fr","fq"].forEach(id=>$("#"+id).oninput=table);
$("#motif").innerHTML=motif();
paint();
</script></body></html>
